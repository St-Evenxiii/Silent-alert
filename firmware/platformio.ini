; Build & flash with:  pio run -d firmware -t upload
[platformio]
src_dir = .

; only build the sketch, not the host-side tests in test/

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<silent_alarm.ino>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
